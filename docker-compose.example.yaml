services:
  backend:
    build:
      context: ./backend
    environment:
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_PATH: /data/app.db
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
