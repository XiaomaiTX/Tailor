services:
  backend:
    build:
      context: ./backend
    environment:
      API_PORT: ${API_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_PATH: /data/app.db
      CORS_ORIGINS: ${CORS_ORIGINS}
      HEADSCALE_URL: ${HEADSCALE_URL}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY}
      HEADSCALE_SYNC_INTERVAL_SECONDS: ${HEADSCALE_SYNC_INTERVAL_SECONDS:-60}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      PEER_RELAY_BOOTSTRAP_ADMINS: ${PEER_RELAY_BOOTSTRAP_ADMINS}
      PEER_RELAY_ADMIN_GROUPS: ${PEER_RELAY_ADMIN_GROUPS:-group:relay-admin}
      PEER_RELAY_REVIEWER_GROUPS: ${PEER_RELAY_REVIEWER_GROUPS:-group:relay-reviewer}
      PEER_RELAY_APPLICANT_MODE: ${PEER_RELAY_APPLICANT_MODE:-all}
      PEER_RELAY_APPLICANT_GROUPS: ${PEER_RELAY_APPLICANT_GROUPS:-group:relay-applicant}
      PEER_RELAY_POLICY_WRITES: ${PEER_RELAY_POLICY_WRITES:-false}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
