name: Docker Image Publish（暂不启用）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Docker 镜像构建暂不执行
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docker 镜像构建已暂时禁用。"

